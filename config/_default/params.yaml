# SITE SETUP (Hugo Blox Kit, config schema v2)
# Documentation: https://docs.hugoblox.com/
# Migrated 2026-11-16 from the v1 keys (appearance, marketing, header.navbar, footer, locale, features);
# each value below is the one the v1 file had. Keys the v1 file did not set are left to Blox's defaults.

hugoblox:
  schema: "2.0"

  identity:
    name: "Uei-Dar Chen"
    type: person
    description: 'Uei-Dar Chen is an HCI researcher at the University of Illinois Urbana-Champaign studying personal AI agents and contextual privacy in human–agent and agent–agent interactions.'
    social:
      twitter: 'udchen19'

  seo:
    title: 'Uei-Dar Chen — HCI Researcher'   # the tab title the v1 site took from hugo.yaml's title

  # The navy ramp for --color-primary-* lives in assets/css/themes/udc.css (plan 1.1), loaded by the
  # head-end hook; the pack here only gives Blox a base to generate from.
  theme:
    mode: system
    pack: "default"

  # The navbar is the site's own (layouts/_partials/components/headers/navbar.html).
  header:
    enable: true
    sticky: false        # a newspaper index line scrolls with the page; also keeps the press layer still
    search: false
    theme_toggle: true

  copyright:
    notice: '© {year} Uei-Dar Chen'
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  content:
    math:
      enable: true

  search:
    enable: false

  locale:
    date_format: '2006.01.02'
    time_format: '3:04 PM'
    address_format: en-us

  privacy:
    enable: false
