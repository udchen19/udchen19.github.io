# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: udc

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Uei-Dar Chen is an HCI researcher at the University of Illinois Urbana-Champaign studying personal AI agents and contextual privacy in human–agent and agent–agent interactions.'
    twitter: 'udchen19' # Updated from GetResearchDev to your personal handle
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: false  # a newspaper index line scrolls with the page; also keeps the press layer still
    show_search: false
    show_theme_chooser: true
    logo:
      text: "Uei-Dar Chen"

# Site footer
footer:
  copyright:
    notice: '© {year} Uei-Dar Chen'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: '2006.01.02'
  time_format: '3:04 PM'
  address_format: en-us

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
