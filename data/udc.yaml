bio:
  affiliation:
    text: I’m an M.S. student in Computer Science at the University of Illinois Urbana-Champaign, advised by [Prof. Yang Wang](https://yangwang.ischool.illinois.edu/).
  # Intro, approved by UD on 2026-11-16 (round 3, with ChatGPT's two edits). Each paragraph keeps the
  # source of every sentence; the template prints only text.
  paragraphs:
    - text: "My research in human–computer interaction is on **personal AI agents**, the assistants that act for a person using their own information across devices and services."
      sources:
        - "Live paragraph 1 (“integrate, interpret, and safeguard information across devices and services”), shortened; \"act for a person using their own information\" (build thread, 2026-11-17) sets up both halves of the question below."
    - text: "My current work asks: when personal agents are acting on our behalf, how can we make sure they “get things done” while appropriately “keeping our secrets”? It looks at **contextual privacy** in human–agent and agent–agent interactions."
      sources:
        - "The question is UD's own words (2026-11-16, \"get things done\" added 2026-11-17; \"keep\" made \"keeping\" after \"while\")."
        - "Live paragraph 2 (the field's term)."
    - text: "Before UIUC, I spent five years with [Prof. Yung-Ju Chang](https://www.armuro.info/) at AIMEX Lab, National Yang Ming Chiao Tung University, on **intelligent notification systems**: what makes an LLM summary useful, when people are willing to give such a system feedback, what they expect from future systems, and whether an extracted task is enough to act on."
      sources:
        - "Five years: Research Assistant Jul 2021 – Aug 2026. One clause per study: NotiSummary (MobileHCI ’25), Tell Me Why You’re Asking (CHI ’26), I Want It to Do More Than Deliver (MobileHCI ’26), Clear Yet Insufficient / Noti (CHI EA ’26)."
    - text: "My work combines qualitative research with system building, from interviews to Android apps used in daily life."
      sources:
        - "Interviews: UD led them for NotiSummary and took part in them for the feedback studies (role notes on the publication pages). Design workshops left out: UD reanalysed that data but did not run the workshops (project page). Apps used in daily life: NotiSummary (Google Play, three months in the wild) and Noti (three-day deployment on participants’ own phones)."

