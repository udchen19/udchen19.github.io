work:
  - page: /project/notillm/
    title: Noti
    meta: CHI EA 2026
    links:
      - label: Paper
        url: /publication/task-extraction/
      - label: Project
        url: /project/notillm/
    # Research question and finding, approved by UD 2026-11-16. Source: the full paper, CHI EA '26, doi 10.1145/3772363.3798322.
    question:
      text: Is extracting the task enough for people to act on it?
      source: "We explore whether large language models (LLMs) can extract task-related information directly from notifications and how users evaluate the extracted items in everyday use."
    finding:
      - text: "In a preliminary three-day deployment of Noti, our LLM task inbox, people still went back to the source notification: the extracted action lacked the urgency, rationale and sense of whose task it was."
        source: "Participants often returned to source notifications to recover context not captured in task items and to assess whether an extracted action was actually relevant to them. (§5) · They described returning to recover context that was not captured in the extracted task item, such as urgency and rationale (§4.2) · extracting an action without sufficient situational context can surface items they do not consider to be their tasks, especially in group conversations where responsibility is implied (§4.2)"
  - page: /project/notisummary/
    title: NotiSummary
    meta: MobileHCI 2025
    links:
      - label: Paper
        url: /publication/notisummarypaper/
      - label: Code
        url: https://github.com/noti-summary/NotiSummary
      - label: Project
        url: /project/notisummary/
    # Research question and finding, approved by UD 2026-11-16. Source: the full paper, PACM HCI (MobileHCI '25), doi 10.1145/3743703.
    question:
      text: What do people want from LLM notification summaries?
      source: "To further understand user expectations for LLM-generated summaries, we interviewed 20 participants following a week-long engagement with the app."
    finding:
      - text: A useful summary depends on its reader. How much it says follows what they can already anticipate and how critical a message is, and related notifications are merged. People wanted an assistant, not just shorter text.
        source: "three key factors that shape effective notification summarization: (1) the desired level of information disclosure, which depends on users’ anticipation of notification content and perceived criticalness; (2) the methods for synthesizing notifications, informed by the interrelationships among notifications; and (3) users’ broader expectations for summaries to assist with task and information management (§7) · they envisioned it as functioning like a virtual assistant (§1, contributions)"
  - page: /project/intelligent-notification-systems/
    title: Visions for Future Notification Systems
    meta: MobileHCI 2026
    links:
      - label: Paper
        url: /publication/intelligent-notification-systems/
      - label: Project
        url: /project/intelligent-notification-systems/
    # Research question and finding, approved by UD 2026-11-16. Source: the full PDF on Prof. Chang's page (PACM HCI, MobileHCI '26;
    # DOI 10.1145/3821653 printed in the PDF, not yet registered on 2026-11-16).
    question:
      text: What do people want from future notification systems?
      source: "Less is known about what features and capabilities users themselves desire from future intelligent notification systems (FINS)."
    finding:
      - text: Not passive alerts but proactive agents, which surface takeaways layer by layer, help with follow-up, infer personal context to anticipate needs, and spread awareness through nearby people and everyday objects.
        source: "Our findings suggest a shift from notification systems as passive alert managers to proactive agents that support users’ attention, actions, and longer-term goals. Participants envisioned FINS as agents that surface actionable takeaways with progressive disclosure, assist follow-up actions … adaptive companions that infer personal context … wanted notification awareness distributed beyond devices via co-present contacts and objects embedded in routines (§7)"
