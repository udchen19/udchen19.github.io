bio:
  affiliation:
    text: I’m an M.S. student in Computer Science at the University of Illinois Urbana-Champaign, advised by [Prof. Yang Wang](https://yangwang.ischool.illinois.edu/).
  paragraphs:
    - text: My primary research interest is **personal AI agents**—how they can integrate, interpret, and safeguard information across devices and services while adapting to individual needs and preferences.
    - text: I’m currently exploring **contextual privacy in human–agent and agent–agent interactions within multi-agent AI systems**.
    - text: Previously, I worked with [Prof. Yung-Ju Chang](https://www.armuro.info/) at AIMEX Lab, National Yang Ming Chiao Tung University, on **intelligent smartphone notification systems**. My research explored how these systems could help people make sense of incoming information and support their everyday needs. This involved understanding what makes notification summaries useful and personally appropriate, and how agents can learn and adapt to individual preferences through feedback. I also studied how people envision future notification systems taking a more proactive, context-aware role beyond delivering messages.
    - text: Across this work, I combined interviews and qualitative analysis with hands-on system building, developing Android prototypes to explore how these ideas could work in everyday use.

