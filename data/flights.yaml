# UD's flights, transcribed from his flight-log screenshots on 2026-11-16 (build thread).
# Public repo: only the airports and the year are kept (no flight numbers, no exact dates).
# The map marks places, not routes (UD, 2026-11-16): the places below print in orange, with their notes
# in a key under the map; every flight prints faint. Notes written by the build thread from UD's
# descriptions, at his request ("find the ones that work best"); his to change.
# airports: every airport of the place gets an orange dot; the name sits by the first one.
# label: where the name sits beside that dot: ne (default), nw, sw or se.
places:
  - {name: Taipei, airports: [TPE, TSA], label: se, note: "Where I’m from. Born here; home until 2006, and again from 2010 to 2026."}
  - {name: London, airports: [LHR, LGW, LTN], note: "Home from 2006 to 2010, while my parents studied here and took me along. Not British in any way, but a good part of me started here."}
  - {name: Japan, airports: [NRT, HND, KIX, ITM], label: nw, note: "Trips for baseball, shopping and culture, again and again."}
  - {name: Chicago (Champaign), airports: [ORD], label: nw, note: "From 2026. The first time properly away from home: out of my shell, starting things of my own."}
