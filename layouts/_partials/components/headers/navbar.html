<header id="site-header" class="udc-header">
  <nav class="udc-nav udc-wrap{{ if .IsHome }} udc-nav-home{{ end }}" aria-label="Main navigation" data-udc-ui>
    <a class="udc-brand" href="/"{{ if .IsHome }} aria-label="Uei-Dar Chen home"{{ end }}>{{ if .IsHome }}UDC<span class="udc-brand-dot">.</span>{{ else }}Uei-Dar Chen{{ end }}</a>
    <ul id="udc-navigation" class="udc-navigation">
      {{ $current := . }}
      {{ range site.Menus.main }}
      <li><a href="{{ .URL }}" data-udc-nav="{{ .Identifier }}"{{ if eq $current.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
    <div class="udc-nav-controls">
      <button type="button" class="udc-language-toggle" data-udc-language-toggle aria-label="切換為中文介面"><span class="udc-en" lang="zh-Hant">中文</span><span class="udc-zh" lang="en">EN</span></button>
      <button type="button" class="theme-toggle udc-theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
        {{ partial "functions/get_icon" (dict "name" "moon" "attributes" "class=\"udc-icon-moon\" aria-hidden=\"true\"") }}
        {{ partial "functions/get_icon" (dict "name" "sun" "attributes" "class=\"udc-icon-sun\" aria-hidden=\"true\"") }}
      </button>
      <button type="button" class="udc-menu-toggle" aria-controls="udc-navigation" aria-expanded="false" aria-label="Open menu">{{ partial "functions/get_icon" (dict "name" "bars-3" "attributes" "aria-hidden=\"true\"") }}</button>
    </div>
  </nav>
</header>
