<header id="site-header" class="udc-header">
  <nav class="udc-nav udc-wrap" aria-label="Main navigation" data-udc-ui>
    <a class="udc-brand" href="/">Uei-Dar Chen</a>
    <ul id="udc-navigation" class="udc-navigation">
      {{ $current := . }}
      {{ range site.Menus.main }}
      <li><a href="{{ .URL }}" data-udc-nav="{{ .Identifier }}"{{ if eq $current.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
    <div class="udc-nav-controls">
      <button type="button" class="udc-language-toggle" data-udc-language-toggle aria-label="切換為中文介面"><span class="udc-en" lang="zh-Hant">中文</span><span class="udc-zh" lang="en">EN</span></button>
      <button type="button" class="theme-toggle udc-theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
        <svg class="udc-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13a8.6 8.6 0 0 1-9.9-9.9A8.7 8.7 0 1 0 20.9 13Z"/></svg>
        <svg class="udc-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
      </button>
      <button type="button" class="udc-menu-toggle" aria-controls="udc-navigation" aria-expanded="false" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </nav>
</header>
