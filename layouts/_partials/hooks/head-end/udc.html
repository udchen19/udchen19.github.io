{{- /* Marks that the site script can run: only then does the phone menu hide behind its button. */}}
<script>document.documentElement.classList.add("udc-js")</script>
{{- if eq .Kind "404" }}<meta name="robots" content="noindex">{{ end }}
{{ $theme := resources.Get "css/themes/udc.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $theme.RelPermalink }}" integrity="{{ $theme.Data.Integrity }}">
{{ $type := resources.Get "css/udc-type.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $type.RelPermalink }}" integrity="{{ $type.Data.Integrity }}">
