{{/* One halftone plate in its own reserved slot. dict: class, ink, ink_night, alt */}}
<figure class="udc-plate {{ .class }}" style="--ink: url({{ .ink }});{{ with .ink_night }} --ink-night: url({{ . }});{{ end }}">
  <span class="udc-plate-ink" role="img" aria-label="{{ .alt }}"></span>
</figure>
