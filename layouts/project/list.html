       No base template: a bare redirect page, kept out of search results. */ -}}
{{- $to := "/projects/" | absURL -}}

<html lang="en">
<head>
<meta charset="utf-8">
<title>Research Projects</title>

</head>
<body><p><a href="{{ $to }}">Research Projects</a></p></body>
</html>
