    <ellipse cx="2" cy="2.6" rx=".8" ry="1.2"/>
    <ellipse cx="6" cy="8.6" rx=".8" ry="1.2"/>
  </g>
  <g fill="#041b31" opacity=".14">
    <ellipse cx="2" cy="2" rx=".65" ry="1"/>
    <ellipse cx="6" cy="8" rx=".65" ry="1"/>
  </g>
</svg>
